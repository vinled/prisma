<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130">
  <g transform="translate(10, 5)">
    <!-- Hand - Back Fingers -->
    <rect x="70" y="35" width="22" height="14" rx="7" fill="#0b2136" transform="rotate(-20 70 35)" />
    <rect x="74" y="55" width="22" height="14" rx="7" fill="#0b2136" transform="rotate(-20 74 55)" />
    <rect x="71" y="75" width="20" height="14" rx="7" fill="#0b2136" transform="rotate(-20 71 75)" />

    <!-- Phone Body -->
    <rect x="25" y="10" width="54" height="96" rx="10" fill="white" stroke="#0b2136" stroke-width="5" />
    
    <!-- Phone Screen Orange Area -->
    <rect x="32" y="27" width="40" height="62" rx="5" fill="#f35c27" />
    
    <!-- Screen Top UI -->
    <circle cx="42" cy="36" r="4" fill="white" />
    <rect x="50" y="34" width="16" height="4" rx="2" fill="white" />
    <rect x="38" y="78" width="28" height="6" rx="3" fill="white" />
    
    <!-- Hand - Palm & Thumb -->
    <path d="M 15 70 C 0 115, 60 125, 80 95 L 75 80 L 20 80 Z" fill="#0b2136" />
    <rect x="12" y="35" width="16" height="50" rx="8" fill="#0b2136" />

    <!-- Checkmark (Overlaps everything) -->
    <path d="M 40 60 L 55 75 L 90 35" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 40 60 L 55 75 L 90 35" fill="none" stroke="#f35c27" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
