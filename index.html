    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket connection errors inside sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
          (typeof event.reason.stack === 'string' && event.reason.stack.includes('createWebSocketModuleRunnerTransport'))
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if ((event.message && typeof event.message === 'string' && event.message.includes('WebSocket')) ||
            (event.filename && event.filename.includes('@vite/client'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
